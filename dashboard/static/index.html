<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FNIRSI 1014D</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --ink:#e6edf3; --dim:#8b949e;
    --ch1:#f2c744; --ch2:#4dd4e0; --ok:#3fb950; --bad:#f85149; --warn:#d29922;
    --grid:#1f2630; --grid-major:#2b3542;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
         padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.01em}
  .sub{color:var(--dim);font-size:12.5px}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;
        padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:#0d1117}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(63,185,80,.16)}
  .dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(248,81,73,.16)}
  main{padding:20px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 300px}
  @media (max-width:940px){main{grid-template-columns:minmax(0,1fr)}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);
           margin:0;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600}
  .card .body{padding:14px}
  canvas{display:block;width:100%;height:auto;background:#080b10}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  td{padding:5px 0;vertical-align:baseline}
  td:first-child{color:var(--dim);white-space:nowrap;padding-right:12px}
  td:last-child{text-align:right;font-weight:550}
  .legend{display:flex;gap:16px;padding:10px 14px;border-top:1px solid var(--line);
          font-size:12.5px;color:var(--dim);flex-wrap:wrap}
  .key{display:inline-flex;align-items:center;gap:7px}
  .swatch{width:11px;height:3px;border-radius:2px}
  .err{margin:0 20px 20px;padding:11px 14px;border-radius:8px;font-size:13px;
       background:rgba(248,81,73,.09);border:1px solid rgba(248,81,73,.35);color:#ffb4ae}
  .muted{color:var(--dim)}
  h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);
     margin:16px 0 6px;font-weight:600}
  h3:first-child{margin-top:0}
</style>
</head>
<body>
<header>
  <h1>FNIRSI 1014D</h1>
  <span class="sub" id="ident">&mdash;</span>
  <span class="spacer"></span>
  <span class="pill"><span class="dot" id="dot"></span><span id="link">connecting&hellip;</span></span>
  <span class="pill" id="run">&mdash;</span>
</header>

<div id="errbox"></div>

<main>
  <div class="card">
    <h2>Traces</h2>
    <canvas id="scope" width="1200" height="620"></canvas>
    <div class="legend">
      <span class="key"><span class="swatch" style="background:var(--ch1)"></span><span id="l1">CH1</span></span>
      <span class="key"><span class="swatch" style="background:var(--ch2)"></span><span id="l2">CH2</span></span>
      <span class="spacer"></span>
      <span id="sweep"></span>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>State</h2>
      <div class="body"><table id="state"></table></div>
    </div>
    <div style="height:20px"></div>
    <div class="card">
      <h2>Measurements</h2>
      <div class="body"><table id="meas"></table></div>
    </div>
  </div>
</main>

<script>
const DIV_X = 12, DIV_Y = 8;          // the 1014D graticule
const cv = document.getElementById('scope');
const cx = cv.getContext('2d');

function grid(){
  const w = cv.width, h = cv.height;
  cx.fillStyle = '#080b10'; cx.fillRect(0,0,w,h);
  cx.lineWidth = 1;
  for(let i=0;i<=DIV_X;i++){
    const x = Math.round(i*w/DIV_X)+.5;
    cx.strokeStyle = (i===DIV_X/2) ? '#2b3542' : '#1f2630';
    cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,h); cx.stroke();
  }
  for(let i=0;i<=DIV_Y;i++){
    const y = Math.round(i*h/DIV_Y)+.5;
    cx.strokeStyle = (i===DIV_Y/2) ? '#2b3542' : '#1f2630';
    cx.beginPath(); cx.moveTo(0,y); cx.lineTo(w,y); cx.stroke();
  }
}

// Samples are raw ADC counts, mid-scale 128, ~25 counts per division.
function trace(samples, colour){
  if(!samples || !samples.length) return;
  const w = cv.width, h = cv.height, mid = h/2, perDiv = h/DIV_Y, perCount = perDiv/25;
  cx.strokeStyle = colour; cx.lineWidth = 1.6;
  cx.lineJoin = 'round'; cx.lineCap = 'round';
  cx.beginPath();
  samples.forEach((v,i)=>{
    const x = i*(w-1)/(samples.length-1);
    const y = mid - (v-128)*perCount;
    i ? cx.lineTo(x,y) : cx.moveTo(x,y);
  });
  cx.stroke();
}

function triggerMark(level){
  if(level==null) return;
  const h = cv.height, mid = h/2, perCount = (h/DIV_Y)/25;
  const y = mid - (level-128)*perCount;
  if(y < 0 || y > h) return;
  cx.strokeStyle = 'rgba(210,153,34,.85)'; cx.lineWidth = 1;
  cx.setLineDash([5,4]);
  cx.beginPath(); cx.moveTo(0,y+.5); cx.lineTo(cv.width,y+.5); cx.stroke();
  cx.setLineDash([]);
  cx.fillStyle = 'rgba(210,153,34,.95)';
  cx.beginPath(); cx.moveTo(cv.width-1,y); cx.lineTo(cv.width-11,y-5);
  cx.lineTo(cv.width-11,y+5); cx.closePath(); cx.fill();
}

const rows = (t, pairs) => {
  t.innerHTML = pairs.map(([k,v]) =>
    `<tr><td>${k}</td><td>${v ?? '<span class="muted">&mdash;</span>'}</td></tr>`).join('');
};

async function tick(){
  let s;
  try{
    s = await (await fetch('/api/state',{cache:'no-store'})).json();
  }catch(e){
    document.getElementById('dot').className = 'dot bad';
    document.getElementById('link').textContent = 'dashboard unreachable';
    return;
  }

  const dot = document.getElementById('dot');
  dot.className = 'dot ' + (s.connected ? 'ok' : 'bad');
  document.getElementById('link').textContent = s.connected
    ? `live · ${s.updated_ago}s ago · ${s.poll_ms}ms`
    : `disconnected (${s.consecutive_failures} tries)`;

  document.getElementById('errbox').innerHTML =
    s.error ? `<div class="err"><strong>${s.error}</strong></div>` : '';

  const id = s.identity || {};
  document.getElementById('ident').textContent =
    id.raw ? `${id.model} · ${id.firmware} · ${id.fpga}` : '—';

  const st = s.status || {};
  const runPill = document.getElementById('run');
  runPill.textContent = st.runstate_label || '—';
  runPill.style.color = st.runstate_label === 'RUNNING' ? 'var(--ok)' : 'var(--warn)';

  grid();
  trace(s.ch2 && s.ch2.samples, getComputedStyle(document.body).getPropertyValue('--ch2'));
  trace(s.ch1 && s.ch1.samples, getComputedStyle(document.body).getPropertyValue('--ch1'));
  triggerMark(st.trig_level);

  document.getElementById('l1').textContent =
    `CH1 ${st.ch1_voltdiv_label ?? '?'}/div ${st.ch1_coupling_label ?? ''} ${st.ch1_probe_label ?? ''}`
    + (st.ch1_enable ? '' : ' (off)');
  document.getElementById('l2').textContent =
    `CH2 ${st.ch2_voltdiv_label ?? '?'}/div ${st.ch2_coupling_label ?? ''} ${st.ch2_probe_label ?? ''}`
    + (st.ch2_enable ? '' : ' (off)');
  document.getElementById('sweep').textContent =
    st.timebase_label ? `${st.timebase_label}/div · ${st.samplecount ?? '?'} pts`
      + (st.roll_mode ? ' · roll' : '') : '';

  rows(document.getElementById('state'), [
    ['Timebase',  st.timebase_label ? st.timebase_label + '/div' : null],
    ['Points',    st.samplecount],
    ['Trigger',   st.trig_mode_label],
    ['Edge',      st.trig_edge_label],
    ['Source',    st.trig_channel==null ? null : 'CH'+(st.trig_channel+1)],
    ['Level',     st.trig_level==null ? null : st.trig_level + ' cnt'],
    ['CH1',       st.ch1_enable ? `${st.ch1_voltdiv_label}/div ${st.ch1_coupling_label}` : 'off'],
    ['CH2',       st.ch2_enable ? `${st.ch2_voltdiv_label}/div ${st.ch2_coupling_label}` : 'off'],
    ['FPGA',      st.fw_fpga==null ? null : 'v'+st.fw_fpga],
  ]);

  const fmt = m => m ? [
    ['min', m.min], ['max', m.max], ['mean', m.mean],
    ['pk-pk', m.pp], ['ac rms', m.ac_rms],
  ] : [];
  const t = document.getElementById('meas');
  const a = fmt(s.measure_ch1), b = fmt(s.measure_ch2);
  t.innerHTML =
    (a.length ? '<tr><td colspan="2"><h3 style="margin:0 0 4px">CH1 &middot; ADC counts</h3></td></tr>'
      + a.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('') : '') +
    (b.length ? '<tr><td colspan="2"><h3>CH2 &middot; ADC counts</h3></td></tr>'
      + b.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('') : '');
}

grid();
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
