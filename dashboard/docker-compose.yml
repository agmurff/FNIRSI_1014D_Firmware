services:
  fnirsi-dashboard:
    build:
      context: .
      args:
        BASE: "${DASHBOARD_BASE:-python:3.12-slim}"
    container_name: fnirsi-dashboard
    restart: unless-stopped
    ports:
      # Host port is configurable because 8080 is far from always free -- on the
      # scadapc box it is already serving a SCADA web app.
      - "${DASHBOARD_PORT:-9110}:8080"
    environment:
      # The machine the scope is physically attached to.
      FNIRSI_MCP_URL: "${FNIRSI_MCP_URL:-http://10.0.20.172:8765/mcp}"
      POLL_INTERVAL: "${POLL_INTERVAL:-0.2}"
      CAPTURE_CH2: "${CAPTURE_CH2:-1}"
      WIRE_DECIMATION: "${WIRE_DECIMATION:-5}"

  # Public URL via a Cloudflare quick tunnel. The hostname is RANDOM and changes on
  # every restart of this container; read it from its logs:
  #     docker logs fnirsi-tunnel 2>&1 | grep trycloudflare
  # No authentication in front of it -- see the warning on the page itself.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: fnirsi-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://fnirsi-dashboard:8080
    depends_on:
      - fnirsi-dashboard
